version: "3.9"

services:
  db:
    image: postgres:16
    container_name: college_library_db
    environment:
      POSTGRES_DB: college_library
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: ./backend
    container_name: college_library_backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/college_library
      SPRING_DATASOURCE_USERNAME: postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: college_library_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
